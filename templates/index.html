<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trading Assistant</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #0f1115; color: #e1e4ea; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .header { background: #181b22; border-bottom: 1px solid #232730; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
        .header h1 { font-size: 16px; font-weight: 700; color: #fff; }
        
        .nav-tabs { display: flex; gap: 8px; }
        .tab-btn { background: #232730; color: #9ca3af; border: none; padding: 6px 12px; font-size: 13px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .tab-btn.active { background: #2563eb; color: #ffffff; }

        .content-area { flex: 1; position: relative; width: 100%; height: 100%; }
        .view { display: none; width: 100%; height: 100%; }
        .view.active { display: block; }
        
        iframe { width: 100%; height: 100%; border: none; }
        
        .rules-container { padding: 20px; overflow-y: auto; height: 100%; }
        .rule-card { background: #181b22; border: 1px solid #232730; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
        .rule-card h3 { color: #3b82f6; font-size: 15px; margin-bottom: 6px; }
        .rule-card p { color: #d1d5db; font-size: 14px; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Trading Assistant</h1>
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('journal', this)">📓 Дневник</button>
            <button class="tab-btn" onclick="switchTab('rules', this)">📈 Правила</button>
        </div>
    </div>

    <div class="content-area">
        <!-- NOTION JOURNAL VIEW -->
        <div id="journal" class="view active">
            <iframe src="https://rain-amusement-743.notion.site/ebd/ec91a1d72b82826a81850151b2955ad0" allowfullscreen></iframe>
        </div>

        <!-- RULES VIEW -->
        <div id="rules" class="view rules-container">
            <div class="rule-card">
                <h3>1. Контекст</h3>
                <p>Ищем 4H Sweep перед входом.</p>
            </div>
            <div class="rule-card">
                <h3>2. Триггер</h3>
                <p>Вход строго по 15M FVG / CHoCH.</p>
            </div>
            <div class="rule-card">
                <h3>3. Риск</h3>
                <p>Максимум 1% на сделку.</p>
            </div>
            <div class="rule-card">
                <h3>4. Дисциплина</h3>
                <p>Не более 2 убыточных сделок в день.</p>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tabId, btn) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        // Инициализация Telegram WebApp
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }
    </script>
</body>
</html>
